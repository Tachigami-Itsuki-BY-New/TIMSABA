[tips-and-tricks-item-description]
fulgora-briefing=[planet=fulgora] is a dry barren planet with no signs of life and dangerous lightning activity in the frequent night cycles.\n[entity=solar-panel] is much less effective however lightning can be collected by [entity=lightning-rod] and stored in [entity=accumulator].\nThere are no natural resources found anywhere on the planet. The only things available are leftovers in the form of [entity=scrap].\nWhat might have been oceans is now full of [fluid=angels-liquid-multi-phase-oil] that can be extracted by [entity=offshore-pump].\n[tile=oil-ocean-shallow] isn't landfillable until much later but it can be crossed by elevated rails. Building [entity=rail-support] on deep parts of the ocean will require additional research.