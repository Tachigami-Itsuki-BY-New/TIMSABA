[tips-and-tricks-item-description]
vulcanus-briefing=[planet=vulcanus] is a hot planet without [fluid=water], you can't find [entity=crude-oil], [entity=angels-natural-gas], or [entity=angels-fissure] there but it contains several new [tooltip=resources,tips-and-tricks-item-description.vulcanus-resources].\n[fluid=lava] is an infinite resource of minerals as a substitute for patches of [entity=angels-ore1], [entity=angels-ore2], [entity=angels-ore3], [entity=angels-ore4], [entity=angels-ore5], [entity=angels-ore6], [entity=senaite-ore] and [entity=franckeite-ore]. Those can be found in raw form only in [entity=big-rock].\n[entity=solar-panel] is much more effective. The environment is inhospitable with mountainous volcanoes, rivers of lava, plains of ash, and sulfuric acid geysers.\n[tile=lava] isn't landfillable until much later but it can be crossed by elevated rails.